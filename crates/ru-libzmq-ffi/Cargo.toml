[package]
name = "ru-libzmq-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zmq"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ru-libzmq-core.workspace = true

[features]
default = ["tcp", "ipc", "inproc", "poller", "plain", "zap"]
full = [
    "curve",
    "draft",
    "gssapi",
    "ipc",
    "inproc",
    "norm",
    "openpgm",
    "plain",
    "poller",
    "tcp",
    "tipc",
    "udp",
    "vmci",
    "vsock",
    "ws",
    "wss",
    "zap",
]
curve = []
draft = []
gssapi = []
ipc = []
inproc = []
norm = []
openpgm = []
plain = []
poller = []
tcp = []
tipc = []
udp = []
vmci = []
vsock = []
ws = []
wss = ["ws"]
zap = []

[lints]
workspace = true
