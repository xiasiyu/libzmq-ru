[package]
name = "libzmq-test-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "libzmq_test_harness"

[[bin]]
name = "differential-runner"
path = "src/bin/differential_runner.rs"

[[bin]]
name = "cpp-message-oracle"
path = "src/bin/cpp_message_oracle.rs"

[[bin]]
name = "rust-message-oracle"
path = "src/bin/rust_message_oracle.rs"

[[bin]]
name = "compare-message-oracles"
path = "src/bin/compare_message_oracles.rs"

[[bin]]
name = "cpp-stable-oracle"
path = "src/bin/cpp_stable_oracle.rs"

[[bin]]
name = "rust-stable-oracle"
path = "src/bin/rust_stable_oracle.rs"

[[bin]]
name = "compare-stable-oracles"
path = "src/bin/compare_stable_oracles.rs"

[[bin]]
name = "unsafe-report"
path = "src/bin/unsafe_report.rs"

[[bin]]
name = "performance-gate"
path = "src/bin/performance_gate.rs"

[dependencies]
libzmq-core.workspace = true
zmq = { package = "libzmq-ffi", path = "../libzmq-ffi" }

[features]
default = []
sodium = ["zmq/sodium"]
wss = ["zmq/wss"]

[lints]
workspace = true
